name: Release

# Two ways to cut a release:
#
#  1. Manual version control — bump yourself, then push a tag:
#       npm version patch
#       git push --follow-tags
#
#  2. Automatic — go to Actions -> Release -> Run workflow, pick a bump size.
#     The workflow bumps package.json, commits, tags, and publishes in one run.
#
# electron-builder uploads to the repo named in package.json -> build.publish,
# and bakes that same repo into app-update.yml so the shipped app knows where to
# look for updates. The preflight step below fails loudly if that config points
# somewhere other than the repository this workflow is running in — otherwise
# the upload fails late, or worse, succeeds while pointing users at the wrong
# update channel.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    # Guards against this workflow triggering itself twice for the same version. The
    # "Bump version, commit, and tag" step below pushes a new tag from inside a
    # workflow_dispatch run, and that push can also satisfy the `push: tags: v*` trigger
    # above — spawning a second, redundant run that builds and publishes the identical
    # version a second time. Skip any push-triggered run whose tag points at a commit this
    # workflow generated itself (recognizable by its own commit message prefix); a manual
    # release (option 1 above) never produces that prefix, so it's unaffected.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # See ci.yml for why --ignore-scripts is safe here: nothing in this dependency tree
      # needs an install-time lifecycle script to function.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Only runs for the "Run workflow" button path. The job-level `if:` above is what
      # actually stops the tag pushed here from spawning a second run of this workflow.
      - name: Bump version, commit, and tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "chore(release): v%s"
          git push origin HEAD --follow-tags

      - name: Preflight — publish target matches this repository
        shell: bash
        run: |
          set -e
          owner=$(node -p "require('./package.json').build.publish.owner")
          repo=$(node -p "require('./package.json').build.publish.repo")
          echo "package.json publishes to: $owner/$repo"
          echo "workflow is running in:     $GITHUB_REPOSITORY"
          if [ "$owner/$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::package.json build.publish points at $owner/$repo but this workflow runs in $GITHUB_REPOSITORY. GITHUB_TOKEN cannot publish to another repository, and the built app would check the wrong repo for updates. Update build.publish in package.json."
            exit 1
          fi

      - name: Preflight — tag matches package.json version
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      # github.ref_name is the branch name ("main") on the workflow_dispatch path, not the tag
      # that was just pushed — read the real version straight out of package.json instead, and
      # do it before publishing so the next step can correct electron-builder's view of the ref.
      - name: Read package version
        id: pkg
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # electron-builder builds the installer, the .blockmap, and latest.yml as somewhat
      # independent tasks, and each one's "find-or-create the GitHub release for this tag"
      # check runs its own fresh lookup against the GitHub API rather than sharing one across
      # the whole run. Two of those lookups landing close enough together can both see "no
      # release yet" and each create their own — which is exactly the split we saw: one release
      # ending up with only the .blockmap, another with the .exe and latest.yml. Creating the
      # release ourselves first, as a single unambiguous step, means every one of
      # electron-builder's internal lookups finds the same existing release instead of racing
      # to create it. `--notes` is required non-interactively; the placeholder text is fine
      # since this is a draft you review and edit before publishing regardless.
      - name: Ensure GitHub release exists for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="v${{ steps.pkg.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — reusing it."
          else
            echo "Creating draft release $tag."
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" --notes "Automated release."
          fi

      # electron-builder also decides which GitHub release to upload to from the GITHUB_REF*
      # environment variables GitHub Actions sets — see getCiTag() in electron-publish
      # (electron-userland/electron-builder PR #7231). Those are fixed to whatever triggered the
      # run and never update mid-job: on the workflow_dispatch path they still say
      # refs/heads/main even after the bump step above pushes a brand-new tag. Override them for
      # just this step so electron-builder sees the tag we actually just created, on top of (not
      # instead of) creating the release above — belt and braces. The push-triggered path
      # already has the correct values, so this passes them through as-is.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', steps.pkg.outputs.version) || github.ref }}
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.pkg.outputs.version) || github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'tag' || github.ref_type }}
        run: npx electron-builder --win --publish always

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowyvr-chat-overlay-v${{ steps.pkg.outputs.version }}
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
