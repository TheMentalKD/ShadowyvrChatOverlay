name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: nothing in this dependency tree needs an install-time lifecycle
      # script (checked via `hasInstallScript` in package-lock.json — the one package that has
      # one, electron-winstaller, backs a Squirrel.Windows target this project doesn't use), and
      # skipping them closes off a lifecycle-script supply-chain attack vector during CI installs.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Syntax-check every JS file
        run: |
          set -e
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "All JS files parse cleanly."

      - name: Verify every require() is a declared dependency
        run: node .github/scripts/check-deps.mjs

  package:
    name: Build Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: nothing in this dependency tree needs an install-time lifecycle
      # script (checked via `hasInstallScript` in package-lock.json — the one package that has
      # one, electron-winstaller, backs a Squirrel.Windows target this project doesn't use), and
      # skipping them closes off a lifecycle-script supply-chain attack vector during CI installs.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build installer (no publish)
        run: npm run pack

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: shadowyvr-chat-overlay-installer
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: nothing in this dependency tree needs an install-time lifecycle
      # script (checked via `hasInstallScript` in package-lock.json — the one package that has
      # one, electron-winstaller, backs a Squirrel.Windows target this project doesn't use), and
      # skipping them closes off a lifecycle-script supply-chain attack vector during CI installs.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runtime dependencies are what ships to users, so those must be clean.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build-time advisories are reported but do not block the build.
      - name: Audit all dependencies (advisory)
        run: npm audit || true
